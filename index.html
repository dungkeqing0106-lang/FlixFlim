<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Flix Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{--bg:#000;--sf:#17181c;--tx:#fff;--mu:#8e9099;--ac:#ee2a2a;--ln:#26272c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,.btn{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.9);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:12px 20px}
.logo{font-weight:800;font-size:22px}
.logo b{background:var(--ac);color:#fff;padding:0 7px;border-radius:4px;margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:20px;color:var(--mu)}
nav a.on{background:var(--sf);color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
#sf{margin-left:auto;display:flex}
#sf input{background:var(--sf);border:1px solid var(--ln);color:var(--tx);padding:8px 14px;border-radius:20px 0 0 20px;width:min(220px,45vw);font:inherit}
#sf button{background:var(--ac);color:#fff;border:0;padding:0 16px;border-radius:0 20px 20px 0;font-weight:700}
#acc{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:3px 12px 3px 3px;display:flex;align-items:center;gap:8px}
#acc.out{padding:6px 14px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#3b4a8a center/cover;font-weight:700;color:#fff;flex:none}
main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:24px;margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1 button{font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{display:block}
.card .im{position:relative;aspect-ratio:2/3;background:var(--sf);border-radius:8px;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.card:hover img{transform:scale(1.05)}
.tag{position:absolute;left:6px;bottom:6px;background:var(--ac);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px}
.card h3{font-size:14px;font-weight:500;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mu)}
.btn,.more,h1 button,.bar button,.eps button{background:var(--sf);border:1px solid var(--ln);padding:6px 16px;border-radius:20px;display:inline-block}
.more{display:block;margin:32px auto 0;padding:10px 28px}
.pri{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important;font-weight:700}
.msg{color:var(--mu);padding:40px 0;text-align:center}
.det{display:grid;grid-template-columns:220px 1fr;gap:28px}
.det img{width:100%;border-radius:10px}
.det h1{margin-bottom:2px}
.sub{color:var(--mu);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips span,.chips a{border:1px solid var(--ln);padding:1px 10px;border-radius:14px;font-size:13px}
.chips a{padding:6px 16px;font-size:15px;background:var(--sf)}
.chips a:hover{border-color:var(--ac)}
.desc{max-width:70ch;color:#c9cee3;margin-bottom:12px}
.player{margin:26px 0 8px;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;color:var(--mu);flex-wrap:wrap}
.eps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.eps button{border-radius:6px;padding:5px 14px;min-width:52px}
.eps button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#fv.on{color:var(--ac);border-color:var(--ac)}
h2{font-size:17px;margin:20px 0 10px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
#md[hidden]{display:none}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:24px;width:min(380px,100%);max-height:90vh;overflow:auto}
.box h2{margin-top:0}
.fld{display:block;width:100%;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:10px 14px;border-radius:8px;font:inherit;margin-bottom:10px}
.box .pri{width:100%;padding:10px;border-radius:8px;margin-bottom:12px}
.er{color:#ff8a80;min-height:1.4em;font-size:13px}
.pr{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.box a{color:var(--ac)}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;z-index:10}
.card .im{border-radius:10px}
.card .im::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--ac);background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.card:hover .im::after{opacity:1}
.hero{position:relative;margin:-24px -20px 28px;height:min(70vh,520px);overflow:hidden;border-radius:0 0 14px 14px;background:var(--sf)}
.hero #hb{position:absolute;inset:0;background:center/cover;transition:background-image .4s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 4%,transparent 70%),linear-gradient(0deg,var(--bg),transparent 45%)}
#hc{position:absolute;z-index:2;left:40px;bottom:72px;max-width:540px}
#hc h2{font-size:clamp(26px,4vw,42px);font-weight:800;line-height:1.15;margin:0 0 4px}
#hc .chips{margin:12px 0 18px}
#hc .btn{padding:10px 26px;font-size:16px}
.dots{position:absolute;z-index:2;right:24px;bottom:22px;display:flex;gap:8px}
.dots button{width:56px;height:36px;border-radius:6px;border:2px solid transparent;background:center/cover;opacity:.55;padding:0}
.dots button.on{border-color:var(--ac);opacity:1}
.row{margin-bottom:30px}
.row h2{display:flex;align-items:baseline;margin:0 0 12px;font-size:20px}
.row h2 a{font-size:13px;color:var(--mu);margin-left:14px;font-weight:400}
.rw{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.rw .card{flex:0 0 160px;scroll-snap-align:start}
.bd{position:absolute;left:0;right:0;top:0;height:440px;background:center top/cover;opacity:.4;z-index:-1;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
@media(max-width:640px){#hc{left:16px;bottom:64px;right:16px}.dots button{width:34px;height:24px}.rw .card{flex-basis:130px}}
body{padding-bottom:76px}
.logo{color:var(--ac)}.logo b{background:none;color:#fff;padding:0;margin-left:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#0b0b0d;border-top:1px solid var(--ln);gap:0;flex-wrap:nowrap;padding:6px 0 max(8px,env(safe-area-inset-bottom))}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0;border-radius:0;color:var(--mu)}
nav a.on{background:none;box-shadow:none;color:var(--ac)}
#acc{padding:2px;border:0;background:none}#acc span:not(.av){display:none}
#acc.out{padding:7px 14px;background:var(--ac);font-weight:700;border-radius:8px}
.card .im,.cw .im{border-radius:12px}
.dots button{width:8px;height:8px;border-radius:4px;background:#fff6!important;opacity:1;border:0}
.dots button.on{width:26px;background:#fff!important}
.row h2{justify-content:space-between}.row h2 a{font-size:24px;color:#fff;margin:0}
.cw{flex:0 0 250px}.cw .im{position:relative;aspect-ratio:16/9;background:var(--sf);overflow:hidden}.cw img{width:100%;height:100%;object-fit:cover}
.cw h3{font-size:15px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw .im::after{content:"▶";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.tp{position:relative;flex:0 0 200px;height:225px;display:block}
.tp .n{position:absolute;left:0;bottom:-10px;font-size:150px;line-height:1;font-weight:800;color:transparent;-webkit-text-stroke:3px #777}
.tp img{position:absolute;right:0;top:0;width:150px;height:225px;object-fit:cover;border-radius:12px}
.tabs{margin-bottom:16px}.tabs a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tl{aspect-ratio:1/1.1;border-radius:14px;padding:14px;font-weight:700;font-size:17px;line-height:1.25}
.card2{background:var(--sf);border-radius:14px;margin-bottom:14px;padding:2px 16px}
.ls{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--ln)}
.card2 .ls:last-child{border:0}.ls i{color:var(--mu);font-style:normal;font-size:20px}
:root{--bg:#0b0710;--sf:rgba(255,255,255,.08);--ln:rgba(255,255,255,.14);--ac:#ff4f9a;--mu:#b3a3bd;--gl:rgba(34,22,44,.55)}
body{background:radial-gradient(60% 40% at 12% 0,#5b1b47 0,transparent 70%),radial-gradient(50% 35% at 100% 30%,#2e1b5e 0,transparent 70%),#0b0710;background-attachment:fixed;padding-bottom:96px}
header{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--ln);border-radius:0 0 24px 24px}
.logo{background:linear-gradient(135deg,#ff8cc4,#ff3d8b);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b{color:#fff;margin-left:0}
.av{background-color:#ff4f9a}
#sf input{border-radius:999px 0 0 999px}#sf button{border-radius:0 999px 999px 0}
nav{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:28px;background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--ln);padding:6px;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
nav a{border-radius:20px;padding:6px 0}nav a.on{background:rgba(255,79,154,.18);color:var(--ac)}
.card .im,.cw .im,.tp img{border-radius:20px}
.card .im{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hero{border-radius:0 0 30px 30px}.player,.det img{border-radius:24px}
.tag{background:rgba(255,79,154,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:10px}
.cw .im::after{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0}
.tp .n{-webkit-text-stroke:3px rgba(255,79,154,.6)}
.btn,.more,h1 button,.bar button,.chips span,.chips a{border-radius:999px;border:1px solid var(--ln);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.eps button{border-radius:14px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.card2{background:var(--sf);border:1px solid var(--ln);border-radius:24px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#md{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.box{background:var(--gl);border:1px solid var(--ln);border-radius:28px;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.fld{background:rgba(255,255,255,.07);border-radius:14px}.box .pri{border-radius:14px}
.pri,.eps button.on,#sf button,#tt,.tabs a.on,#acc.out{background:linear-gradient(135deg,#ff7ab8,#ff3d8b)!important;border-color:transparent!important;color:#fff!important}
#tt{border-radius:999px}
.logo{display:flex;align-items:center;gap:6px}
.player{position:relative}.player video{object-fit:contain;background:#000}.player:fullscreen{border-radius:0;aspect-ratio:auto}
.ctl{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));transition:opacity .25s}
.player.hide .ctl{opacity:0;pointer-events:none}
.ctl input{width:100%;accent-color:var(--ac)}
.cr{display:flex;align-items:center;gap:6px}.cr i{flex:1}
.cr button{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:0;border-radius:999px;color:#fff;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 10px}
.cr small{font-size:11px;font-weight:700}.cr span{font-size:13px;margin-left:6px;white-space:nowrap}
#pb svg{fill:currentColor}
#sf{margin-left:auto;position:relative;display:flex;align-items:center}
#sf #sb{width:36px;height:36px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:var(--sf)!important;border:1px solid var(--ln)!important;color:#fff!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#sf input{display:none;position:fixed;top:66px;left:12px;right:12px;width:auto;height:44px;border-radius:999px;padding:0 18px;background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--ln);z-index:7}
#sf.open input{display:block}
.card{min-width:0}
.card .im{aspect-ratio:2/3;width:100%}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{line-height:1.4;height:2.8em;margin-top:8px}
.card small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .card{flex:0 0 160px;width:160px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(max-width:640px){.rw .card{flex-basis:130px;width:130px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
header{position:relative;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;border-radius:0;box-shadow:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{min-height:100dvh;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
input,textarea{-webkit-user-select:text;user-select:text;font-size:16px}
header{padding-top:calc(env(safe-area-inset-top) + 10px)}
#sf input{top:calc(env(safe-area-inset-top) + 66px)}
main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.rw{-webkit-overflow-scrolling:touch;scrollbar-width:none}.rw::-webkit-scrollbar{display:none}
.card,.btn,.more,.eps button,.cr button,.ls,nav a,.tl,.chips a{transition:transform .15s,opacity .15s}
.card:active,.btn:active,.more:active,.eps button:active,.cr button:active,.ls:active,nav a:active,.tl:active,.chips a:active{transform:scale(.96);opacity:.85}
.btn,.more,.chips a,.eps button{min-height:40px}
#tt{bottom:calc(96px + env(safe-area-inset-bottom))}
.ctl{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
@media(max-width:640px){#md{align-items:flex-end;padding:0}.box{width:100%;max-height:85dvh;border-radius:28px 28px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}main{padding-top:8px}.hero{margin-top:-8px}}
@media(max-width:640px){.det{grid-template-columns:1fr}.det img{max-width:200px}}

/* === Fix v2 === */
:root{--hh:calc(env(safe-area-inset-top) + 70px)}
/* 1+3: thẻ Xem tiếp cố định kích thước, không bị tiêu đề dài kéo giãn */
.cw{flex:0 0 240px;width:240px;min-width:0;max-width:240px}
.cw .im{width:100%;aspect-ratio:16/9}
.cw .im img{display:block;width:100%;height:100%;object-fit:cover}
.cw h3{display:block;width:100%;min-width:0}
.row{margin-bottom:20px}
.rw{padding-bottom:0;align-items:flex-start}
/* 2: header trong suốt, nổi trên banner, không còn nền đen */
header{position:absolute;top:0;left:0;right:0;z-index:7;background:linear-gradient(180deg,rgba(11,7,16,.55),rgba(11,7,16,0));-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none}
main{padding-top:var(--hh)}
.hero{margin-top:calc(-1 * var(--hh))}
@media(max-width:640px){main{padding-top:var(--hh)}.hero{margin-top:calc(-1 * var(--hh))}}

/* === Fix v3 === */
/* trình phát: bỏ khoảng trống dưới thanh điều khiển (safe-area chỉ áp dụng khi toàn màn hình) */
.ctl{padding-bottom:10px}
.player:fullscreen .ctl,.player:-webkit-full-screen .ctl{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
/* Top 10: hết rung/trượt dọc, số không bị cắt */
.rw{overflow-y:hidden;overscroll-behavior-x:contain}
.tp{overflow:hidden;scroll-snap-align:start}
.tp .n{bottom:0;line-height:.8}

/* === Fix v4: toàn màn hình tự xoay ngang === */
html.fsl,html.fsl body{overflow:hidden}
.player.fake{position:fixed;z-index:100;margin:0;border-radius:0;aspect-ratio:auto;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:#000}
@media (orientation:portrait){
  .player.fake{left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
}
.player.fake video{object-fit:contain}
.player.fake .ctl{padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* === Fix v5: tối ưu iPad === */
@media (min-width:768px){
  :root{--hh:calc(env(safe-area-inset-top) + 88px);--px:max(36px,env(safe-area-inset-left))}
  header{padding-left:var(--px);padding-right:max(36px,env(safe-area-inset-right));padding-bottom:16px}
  .logo{font-size:30px;gap:10px}.logo svg{width:38px;height:38px}
  #acc,#sf button{min-height:44px}
  main{max-width:1440px;padding-left:var(--px);padding-right:max(36px,env(safe-area-inset-right))}
  .hero{height:min(58vh,600px);margin-left:calc(-1 * var(--px));margin-right:calc(-1 * max(36px,env(safe-area-inset-right)));border-radius:0 0 40px 40px}
  #hc{left:var(--px);bottom:84px;max-width:660px}
  #hc h2{font-size:clamp(34px,4.6vw,54px)}
  #hc .btn{padding:14px 34px;font-size:18px}
  .dots{right:var(--px);bottom:34px}
  .row{margin-bottom:30px}
  .row h2{font-size:24px;margin-bottom:14px}
  .rw{gap:20px}
  .rw .card{flex:0 0 184px;width:184px}
  .card h3{font-size:15px}
  .cw{flex:0 0 300px;width:300px;max-width:300px}
  .cw h3{font-size:16px}
  .tp{flex:0 0 235px;height:264px}
  .tp img{width:176px;height:264px}
  .tp .n{font-size:176px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .det{grid-template-columns:300px 1fr;gap:36px;align-items:start}
  .det img{max-width:none}
  .det h1{font-size:34px}
  .desc{font-size:17px;line-height:1.65}
  .chips a,.chips span{font-size:15px}
  .player{margin-top:20px}
  .eps button{min-height:44px;min-width:64px;font-size:16px}
  .btn,.more,.bar button{min-height:44px}
  nav{left:50%;right:auto;width:min(640px,calc(100% - 48px));transform:translateX(-50%)}
  nav a{font-size:13px}
  .box{width:min(480px,100%);padding:30px}
  #md{align-items:center}
  .card2{max-width:760px}
}
@media (min-width:1024px){
  .hero{height:min(62vh,660px)}
  .rw .card{flex-basis:200px;width:200px}
  .cw{flex-basis:340px;width:340px;max-width:340px}
  .tp{flex-basis:250px;height:285px}.tp img{width:190px;height:285px}.tp .n{font-size:190px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px}
  .det{grid-template-columns:340px 1fr}
}
/* iPad: dùng bút/ngón tay nên bỏ hiệu ứng hover dính */
@media (hover:none){.card:hover img{transform:none}.card:hover .im::after{opacity:0}}

/* === Fix v6: màn hình tỉ lệ 4:3 (iPad 1024x768, 768x1024, màn 4:3) === */
/* Ngang 4:3 */
@media (min-width:768px) and (min-aspect-ratio:5/4) and (max-aspect-ratio:7/5){
  :root{--hh:calc(env(safe-area-inset-top) + 78px);--px:max(28px,env(safe-area-inset-left))}
  header{padding-bottom:12px}
  .logo{font-size:26px}.logo svg{width:32px;height:32px}
  .hero{height:min(56vh,520px)}
  #hc{bottom:64px;max-width:min(580px,60vw)}
  #hc h2{font-size:clamp(30px,4vw,44px)}
  #hc .chips{margin:8px 0 14px}
  .row{margin-bottom:22px}
  .rw .card{flex-basis:clamp(168px,17vw,208px);width:clamp(168px,17vw,208px)}
  .cw{flex-basis:clamp(270px,30vw,330px);width:clamp(270px,30vw,330px);max-width:clamp(270px,30vw,330px)}
  .tp{flex-basis:clamp(210px,22vw,250px);height:clamp(250px,27vw,285px)}
  .tp img{width:clamp(160px,17vw,190px);height:clamp(250px,27vw,285px)}
  .tp .n{font-size:clamp(150px,17vw,190px)}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .det{grid-template-columns:clamp(240px,26vw,320px) 1fr;gap:30px}
  /* trình phát luôn nằm gọn trong màn hình, không bị cắt đáy */
  .player{width:min(100%,calc((100dvh - 150px) * 16 / 9));margin-left:auto;margin-right:auto}
  .player.fake{width:100vw;margin:0}
  .bar,#ps{max-width:100%}
  nav{width:min(600px,calc(100% - 48px))}
}
/* Dọc 4:3 */
@media (min-width:600px) and (min-aspect-ratio:5/7) and (max-aspect-ratio:4/5){
  :root{--px:max(30px,env(safe-area-inset-left))}
  .hero{height:min(44vh,520px)}
  #hc{bottom:60px;max-width:70vw}
  #hc h2{font-size:clamp(30px,5.4vw,46px)}
  .rw .card{flex-basis:clamp(150px,23vw,190px);width:clamp(150px,23vw,190px)}
  .cw{flex-basis:clamp(260px,38vw,310px);width:clamp(260px,38vw,310px);max-width:clamp(260px,38vw,310px)}
  .tp{flex-basis:clamp(200px,30vw,240px);height:clamp(240px,36vw,270px)}
  .tp img{width:clamp(150px,22vw,180px);height:clamp(240px,36vw,270px)}
  .tp .n{font-size:clamp(140px,22vw,180px)}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .det{grid-template-columns:clamp(220px,32vw,280px) 1fr;gap:28px}
  .player{width:100%}
}

/* === Fix v7: iPad xoay ngang -> thanh bên phải; xoay dọc -> thanh dưới === */
@media (min-width:768px) and (min-height:600px) and (orientation:landscape){
  :root{--sb:calc(104px + env(safe-area-inset-right))}
  body{padding-left:0;padding-right:var(--sb);padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  header{left:0;right:var(--sb)}
  nav{
    top:50%;bottom:auto;left:auto;right:max(14px,env(safe-area-inset-right));
    width:84px;max-height:calc(100dvh - 40px);
    transform:translateY(-50%);
    flex-direction:column;justify-content:center;gap:6px;padding:10px 6px;
    border-radius:32px;overflow-y:auto;scrollbar-width:none
  }
  nav::-webkit-scrollbar{display:none}
  nav a{flex:0 0 auto;width:100%;padding:12px 0;border-radius:24px;font-size:12px}
  #tt{bottom:24px}
  .player.fake{left:0}
}
}

<script>
const CATS=[['phim-moi','Mới cập nhật','c'],['phim-bo','Phim bộ','c'],['phim-le','Phim lẻ','c'],['hoat-hinh','Hoạt hình','c'],['g','Thể loại',''],['fav','Yêu thích',''],['his','Lịch sử','']];
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>p||'';
function toast(t){const e=document.createElement('div');e.id='tt';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}

/* ---- Dữ liệu & tài khoản (lưu trong trình duyệt) ---- */
let db={u:{},cur:null,g:{fav:[],his:[]}};
try{db=Object.assign(db,JSON.parse(localStorage.getItem('cp_db')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('cp_db',JSON.stringify(db))}catch(e){toast('Bộ nhớ đầy, hãy dùng ảnh avatar nhỏ hơn')}};
let pushT;const save=()=>{persist();if(db.cur&&db.u[db.cur]&&db.u[db.cur].cloud){clearTimeout(pushT);pushT=setTimeout(push,2500)}};
const me=()=>db.cur&&db.u[db.cur]?db.u[db.cur]:db.g;
async function hash(p,s){if(!window.crypto||!crypto.subtle)return btoa(unescape(encodeURIComponent(s+p)));const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const avh=(n,av,sz)=>`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.45}px;${av?`background-image:url(${av})`:''}">${av?'':esc(n[0].toUpperCase())}</span>`;
function renderAcc(){const b=$('#acc');if(!b)return;if(db.cur&&db.u[db.cur]){b.className='';b.innerHTML=avh(db.cur,db.u[db.cur].av,32)+'<span>'+esc(db.cur)+'</span>';b.onclick=()=>location.hash='#/me'}else{b.className='out';b.textContent='Đăng nhập';b.onclick=()=>auth('in')}}
function modal(h){$('#md').innerHTML='<div class="box">'+h+'</div>';$('#md').hidden=false}
const closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};
function restore(txt){
  try{const o=JSON.parse(txt),d=o.data;if(o.app!=='cine-play'||!o.user||!Array.isArray(d.fav)||!Array.isArray(d.his)||typeof d.h!=='string')throw 0;
    const ex=db.u[o.user];
    if(ex){const m=(a,b)=>[...a,...b.filter(x=>!a.some(y=>y.slug===x.slug))];ex.fav=m(ex.fav,d.fav);ex.his=m(ex.his,d.his).slice(0,60)}else db.u[o.user]=d;
    db.cur=o.user;save();closeM();renderAcc();route();toast('Đã khôi phục dữ liệu')}
  catch(e){toast('File sao lưu không hợp lệ')}}

/* ---- Sao lưu đám mây (Firebase Auth + Firestore, gọi bằng REST) ----
   Điền apiKey và projectId của dự án Firebase để bật. Để trống thì chỉ dùng tài khoản trên máy + file sao lưu. */
const CLOUD={apiKey:'AIzaSyBAHBUrFVD4KQYmhzVUV80TKb0DoQxyftg',projectId:'flixanime-1f434'};
const cloudOn=()=>!!(CLOUD.apiKey&&CLOUD.projectId);
const cmail=n=>n+'@flixanime.app';
async function cAuth(n,p,up){
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+(up?'signUp':'signInWithPassword')+'?key='+CLOUD.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:cmail(n),password:p,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'ERR');
  return{uid:j.localId,rt:j.refreshToken,tok:j.idToken,exp:Date.now()+(+j.expiresIn-60)*1000}}
async function cTok(u){const c=u.cloud;if(c.tok&&c.exp>Date.now())return c.tok;
  const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+CLOUD.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(c.rt)});
  const j=await r.json();if(!r.ok)throw new Error('TOKEN');c.tok=j.id_token;c.rt=j.refresh_token;c.exp=Date.now()+(+j.expires_in-60)*1000;persist();return c.tok}
const cDoc=u=>`https://firestore.googleapis.com/v1/projects/${CLOUD.projectId}/databases/(default)/documents/users/${u.cloud.uid}`;
async function cGet(u){const r=await fetch(cDoc(u),{headers:{Authorization:'Bearer '+await cTok(u)}});if(r.status===404)return null;const j=await r.json();if(!r.ok)throw new Error('GET');return JSON.parse(j.fields.d.stringValue)}
async function cPut(u){const t=Date.now();
  const r=await fetch(cDoc(u)+'?updateMask.fieldPaths=d',{method:'PATCH',headers:{Authorization:'Bearer '+await cTok(u),'Content-Type':'application/json'},body:JSON.stringify({fields:{d:{stringValue:JSON.stringify({fav:u.fav,his:u.his,av:u.av,t})}}})});
  if(!r.ok)throw new Error('PUT');u.sync=t;persist()}
async function push(){const u=db.cur&&db.u[db.cur];if(cloudOn()&&u&&u.cloud)try{await cPut(u)}catch(e){}}
function mergeIn(u,d){const m=(a,b)=>[...a,...b.filter(x=>!a.some(y=>y.slug===x.slug))];u.fav=m(u.fav,d.fav||[]);u.his=m(u.his,d.his||[]).slice(0,60);if(!u.av&&d.av)u.av=d.av}
let lastPull=0;
async function pullSync(u,force){
  if(!cloudOn()||!u||!u.cloud||(!force&&Date.now()-lastPull<60000))return false;lastPull=Date.now();
  try{const d=await cGet(u);
    if(d&&d.t>(u.sync||0)){u.fav=d.fav||[];u.his=d.his||[];if(d.av)u.av=d.av;u.sync=d.t;persist();renderAcc();return true}
    if(!d)await cPut(u);return false}catch(e){return null}}
async function cloudLogin(n,p,up,er){
  if(p.length<6){er.textContent='Mật khẩu cần ít nhất 6 ký tự';return false}
  const loc=db.u[n];
  if(up&&loc){er.textContent='Tên này đã có người dùng';return false}
  er.textContent='Đang kết nối…';
  let c,m='';
  try{c=await cAuth(n,p,up)}catch(e){m=e.message||'';
    /* tài khoản cũ chỉ có trên máy: đúng mật khẩu thì tự tạo bản đám mây */
    if(!up&&/EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD/.test(m)&&loc&&loc.h===await hash(p,loc.s)){try{c=await cAuth(n,p,true)}catch(_){}}}
  if(!c){er.textContent=/EMAIL_EXISTS/.test(m)?'Tên này đã có người dùng':/EMAIL_NOT_FOUND|INVALID|PASSWORD/.test(m)?'Sai tên đăng nhập hoặc mật khẩu':/WEAK/.test(m)?'Mật khẩu cần ít nhất 6 ký tự':/TOO_MANY/.test(m)?'Thử quá nhiều lần, hãy đợi một lúc':'Không kết nối được đám mây';return false}
  const sl=Math.random().toString(36).slice(2);
  const u=loc||(db.u[n]={av:null,fav:[],his:[]});u.s=sl;u.h=await hash(p,sl);u.cloud=c;
  if(up){u.fav=[...db.g.fav];u.his=[...db.g.his];db.g={fav:[],his:[]}}
  try{const d=await cGet(u);if(d)mergeIn(u,d);await cPut(u)}catch(e){toast('Chưa đồng bộ được, sẽ thử lại sau')}
  db.cur=n;save();return true}
const readF=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsText(f)};

  const up=mode==='up';

    if(!/^[a-z0-9_.]{3,20}$/.test(n))return er.textContent='Tên 3–20 ký tự: chữ thường, số, dấu _ hoặc .';

      const s=Math.random().toString(36).slice(2);db.u[n]={s,h:await hash(p,s),av:null,fav:[...db.g.fav],his:[...db.g.his]};db.g={fav:[],his:[]}}

}

  if($('#cs'))$('#cs').onclick=async()=>{const r=await pullSync(u,true);if(r===null)return toast('Không đồng bộ được, kiểm tra mạng');if(r===false)try{await cPut(u)}catch(e){return toast('Không đồng bộ được, kiểm tra mạng')}toast('Đã đồng bộ');route();prof()};
  if($('#cb'))$('#cb').onclick=async()=>{const p=$('#cp').value,er=$('#ce');
    if(p.length<6)return er.textContent='Mật khẩu cần ít nhất 6 ký tự';
    if(u.h!==await hash(p,u.s))return er.textContent='Sai mật khẩu';
    er.textContent='Đang kết nối…';
    try{let c;try{c=await cAuth(n,p,true)}catch(e){if(/EMAIL_EXISTS/.test(e.message))c=await cAuth(n,p,false);else throw e}
      u.cloud=c;const d=await cGet(u);if(d)mergeIn(u,d);await cPut(u);save();toast('Đã bật sao lưu đám mây');route();prof()}
    catch(e){u.cloud=null;er.textContent=/INVALID|PASSWORD/.test(e.message||'')?'Tên này đã có trên đám mây với mật khẩu khác':'Không kết nối được đám mây'}};

const U=(c,p)=>!p?'':/^https?:/.test(p)?p:c+'/'+String(p).replace(/^\//,'');
const nItem=(s,m,c)=>({s,slug:m.slug,name:m.name,origin_name:m.origin_name||m.original_name,thumb_url:U(c,m.thumb_url),poster_url:U(c,m.poster_url),year:m.year,episode_current:m.episode_current||m.current_episode,quality:m.quality,lang:m.lang||m.language,category:Array.isArray(m.category)?m.category:[],country:Array.isArray(m.country)?m.country:[],total:m.total_episodes,type:m.type});
async function fetchList(src,k,key,page,extra=''){
  const o=SRC[src],q='page='+page,e=encodeURIComponent(key||'');
  if(k==='anime'){
    const mv=key==='le',none={items:[],pages:1},hh=x=>!x.category.length||x.category.some(c=>c.slug==='hoat-hinh'||/hoạt hình/i.test(c.name||''));
    const [a,b]=await Promise.all([fetchList(src,'type','hoat-hinh',page).catch(()=>none),o.t==='n'?none:fetchList(src,'type',mv?'phim-le':'phim-bo',page,'category=hoat-hinh').catch(()=>none)]);
    const seen=new Set(),items=[];
    for(const m of[...a.items.filter(x=>isMovie(x)===mv),...b.items.filter(hh)])if(!seen.has(m.slug)){seen.add(m.slug);items.push(m)}
    return{items,raw:a.items.length+b.items.length,pages:Math.max(a.pages,b.pages)}
  }
  if(o.t==='n'){
    const b={new:'/films/phim-moi-cap-nhat',type:'/films/danh-sach/'+key,genre:'/films/the-loai/'+key,search:'/films/search?keyword='+e}[k];
    const r=await fetch(o.base+b+(b.includes('?')?'&':'?')+q);if(!r.ok)throw 0;const j=await r.json();
    return{items:(j.items||[]).map(m=>nItem(src,m,'')),pages:j.paginate?.total_page||99}
  }
  const add=x=>x+(x.includes('?')?'&':'?')+q+(extra?'&'+extra:'');
  const ps={new:o.nw.map(add),type:['/v1/api/danh-sach/'+key,'/danh-sach/'+key].map(add),genre:['/v1/api/the-loai/'+key,'/the-loai/'+key].map(add),search:['/v1/api/tim-kiem?keyword='+e,'/tim-kiem?keyword='+e].map(add)}[k];
  let d={};
  for(const p of ps){try{const r=await fetch(o.base+p);if(!r.ok)continue;const x=await r.json();d=x.data||x;if((d.items||[]).length)break}catch(_){}}
  const c=d.APP_DOMAIN_CDN_IMAGE||new URL(o.base).origin,pg=d.params?.pagination||d.pagination||{};
  return{items:(d.items||[]).map(m=>nItem(src,m,c)),pages:pg.totalPages||(pg.totalItems?Math.ceil(pg.totalItems/(pg.totalItemsPerPage||1)):99)}
}
async function fetchDetail(src,slug){
  const o=SRC[src],sl=encodeURIComponent(slug);
  if(o.t==='n'){
    const r=await fetch(o.base+'/film/'+sl);if(!r.ok)throw 0;const m=(await r.json()).movie;if(!m)throw 0;
    const g=n=>Object.values(m.category||{}).find(x=>x.group?.name===n)?.list||[];
    return{...nItem(src,m,''),content:m.description,time:m.time,category:g('Thể loại'),country:g('Quốc gia'),year:(g('Năm')[0]||{}).name,actor:(m.casts||'').split(',').map(x=>x.trim()).filter(Boolean),episodes:(m.episodes||[]).map(sv=>({server_name:sv.server_name,server_data:(sv.items||[]).map(e=>({name:e.name,link_embed:e.embed,link_m3u8:e.m3u8}))}))}
  }
  const r=await fetch(o.base+'/phim/'+sl);if(!r.ok)throw 0;const j=await r.json(),m=j.movie||j.data?.item;if(!m)throw 0;
  const c=j.data?.APP_DOMAIN_CDN_IMAGE||new URL(o.base).origin;
  return{...nItem(src,m,c),content:m.content,time:m.time,category:m.category||[],country:m.country||[],actor:m.actor||[],episodes:j.episodes||m.episodes||[]}
}

async function list(title,kind,key,pre='',extra='',flt=null){
  let page=1,tot=0;const s0=S;
  app.innerHTML=`${pre}<h1>${esc(title)}</h1><div class="grid" id="g"></div><div id="ft"></div>`;bindSrc();
  const load=async()=>{
    $('#ft').innerHTML='<p class="msg">Đang tải…</p>';
    try{
      let n=0,more=false;
      for(let t=0;t<4&&n<12;t++){
        const d=await fetchList(s0,kind,key,page,extra),it=flt?d.items.filter(flt):d.items;
        n+=it.length;tot+=it.length;$('#g').insertAdjacentHTML('beforeend',it.map(m=>card(m)).join(''));
        more=(d.raw??d.items.length)>0&&page<d.pages;if(!more)break;page++;
      }
      if(!tot){$('#ft').innerHTML=`<p class="msg">${SRC[s0].n} không có kết quả phù hợp. Vào tab Cá nhân để đổi nguồn phim.</p>`;return}
      $('#ft').innerHTML=more?'<button class="more" id="mb">Xem thêm</button>':'';
      if($('#mb'))$('#mb').onclick=load;
    }catch(e){$('#ft').innerHTML=`<p class="msg">Không tải được dữ liệu từ ${SRC[s0].n}. Vào tab Cá nhân để đổi nguồn phim.</p>`}
  };
  load();
}

function play(ep,mode){

  if(mode==='embed'||!ep.link_m3u8){box.innerHTML=`<iframe src="${esc(ep.link_embed)}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;return}
  const ICP='M7 4l13 8-13 8z',ICA='M8 4v16M16 4v16';
  box.className='player';
  box.innerHTML=`<video playsinline autoplay></video><div class="ctl"><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Tua"><div class="cr"><button data-a="b" aria-label="Lùi 10 giây">${ic('M3 12a9 9 0 103-6.7M3 4v5h5')}<small>10</small></button><button data-a="p" id="pb" aria-label="Phát hoặc dừng">${ic(ICP)}</button><button data-a="f" aria-label="Tua 10 giây">${ic('M21 12a9 9 0 11-3-6.7M21 4v5h-5')}<small>10</small></button><span id="tm">0:00 / 0:00</span><i></i><button data-a="pip" aria-label="Hình trong hình">${ic('M3 5h18v14H3zM12 12h7v5h-7z')}</button><button data-a="fs" aria-label="Toàn màn hình">${ic('M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5')}</button></div></div>`;
  const v=box.querySelector('video'),sk=$('#sk'),dur=()=>isFinite(v.duration)?v.duration:0;
  v.ontimeupdate=()=>{const d=dur();if(d)sk.value=v.currentTime/d*1000;$('#tm').textContent=fmt(v.currentTime)+' / '+fmt(d)};
  v.onplay=v.onpause=()=>$('#pb path').setAttribute('d',v.paused?ICP:ICA);
  v.onclick=()=>v.paused?v.play():v.pause();
  sk.oninput=()=>{v.currentTime=sk.value/1000*dur()};
  box.querySelector('.cr').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,d=document;
    if(a==='b')v.currentTime=Math.max(0,v.currentTime-10);
    if(a==='f')v.currentTime=Math.min(dur()||1e9,v.currentTime+10);
    if(a==='p')v.paused?v.play():v.pause();
    if(a==='pip'){const msg=()=>toast(navigator.standalone?'Ứng dụng màn hình chính chưa cho bật hình trong hình, hãy mở bằng Safari':'Trình duyệt chưa hỗ trợ hình trong hình');
      try{
        if(v.webkitSupportsPresentationMode&&v.webkitSupportsPresentationMode('picture-in-picture')){
          const go=()=>{try{v.webkitSetPresentationMode(v.webkitPresentationMode==='picture-in-picture'?'inline':'picture-in-picture')}catch(_){msg()}};

        }else if(d.pictureInPictureEnabled&&v.requestPictureInPicture){
          Promise.resolve(d.pictureInPictureElement?d.exitPictureInPicture():v.requestPictureInPicture()).catch(msg);
        }else msg();
      }catch(_){msg()}}
    if(a==='fs'){
      const real=d.fullscreenElement||d.webkitFullscreenElement;
      if(real){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
      if(box.classList.contains('fake')){box.classList.remove('fake');document.documentElement.classList.remove('fsl');return}
      const rq=box.requestFullscreen||box.webkitRequestFullscreen;
      if(rq){
        Promise.resolve(rq.call(box)).then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{});
      }else{

      }
    }
  };
  let ht;const sh=()=>{box.classList.remove('hide');clearTimeout(ht);ht=setTimeout(()=>{if(!v.paused)box.classList.add('hide')},3000)};
  box.onmousemove=box.ontouchstart=sh;sh();

  if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=ep.link_m3u8;v.onerror=()=>{if(ep.link_embed)play(ep,'embed')}}
